<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Shoot Prep — Timeline</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Inter:wght@400;500;600;700&display=swap');

  :root{
    --bg: #14100e;
    --bg-card: #1e1815;
    --skin: #d9a374;
    --skin-deep: #b97a4f;
    --amber: #e8873a;
    --line: #332a24;
    --text: #f2e9df;
    --text-dim: #9c8f83;
  }
  *{margin:0;padding:0;box-sizing:border-box;}
  body{
    background: var(--bg);
    color: var(--text);
    font-family: 'Inter', sans-serif;
    min-height: 100vh;
    padding: 24px 16px 60px;
  }
  .wrap{max-width: 640px; margin: 0 auto;}

  header{margin-bottom: 32px;}
  .eyebrow{
    font-size: 12px;
    letter-spacing: 0.14em;
    text-transform: uppercase;
    color: var(--amber);
    font-weight: 600;
    margin-bottom: 8px;
  }
  h1{
    font-family: 'Bebas Neue', sans-serif;
    font-size: 52px;
    line-height: 0.95;
    letter-spacing: 0.01em;
    background: linear-gradient(180deg, #fff 0%, var(--skin) 100%);
    -webkit-background-clip: text;
    background-clip: text;
    color: transparent;
  }
  .sub{color: var(--text-dim); font-size: 14px; margin-top: 10px; max-width: 46ch;}

  /* Timeline */
  .timeline{ position: relative; margin: 36px 0; }
  .timeline::before{
    content:'';
    position:absolute; left: 19px; top: 8px; bottom: 8px;
    width: 2px;
    background: linear-gradient(180deg, var(--skin-deep), var(--line));
  }
  .stage{
    position: relative;
    padding: 0 0 0 52px;
    margin-bottom: 4px;
  }
  .stage-dot{
    position: absolute; left: 11px; top: 2px;
    width: 18px; height: 18px;
    border-radius: 50%;
    background: var(--bg-card);
    border: 2px solid var(--skin-deep);
    display:flex; align-items:center; justify-content:center;
    font-size: 10px; font-weight:700; color: var(--skin);
    z-index: 2;
    transition: all .25s ease;
  }
  .stage.done .stage-dot{ background: var(--amber); border-color: var(--amber); color:#1e1815;}
  .stage-head{
    display:flex; align-items:baseline; gap:10px;
    cursor: pointer;
    padding: 10px 0;
    user-select:none;
  }
  .stage-time{
    font-family:'Bebas Neue',sans-serif;
    font-size: 13px;
    letter-spacing: 0.06em;
    color: var(--amber);
    white-space: nowrap;
  }
  .stage-title{ font-size: 16px; font-weight: 600; }
  .stage-arrow{ margin-left:auto; color: var(--text-dim); font-size:12px; transition: transform .2s;}
  .stage.open .stage-arrow{ transform: rotate(90deg); }

  .stage-body{
    max-height: 0;
    overflow: hidden;
    transition: max-height .3s ease;
  }
  .stage.open .stage-body{ max-height: 500px; }

  .stage-content{
    padding: 4px 0 20px 0;
    color: var(--text-dim);
    font-size: 14px;
    line-height: 1.6;
  }
  .stage-content ul{ list-style:none; }
  .stage-content li{
    position: relative;
    padding-left: 18px;
    margin-bottom: 8px;
  }
  .stage-content li::before{
    content:'—';
    position:absolute; left:0; color: var(--skin-deep);
  }
  .warn{ color: var(--amber); font-weight: 500; }

  /* Checklist card */
  .card{
    background: var(--bg-card);
    border: 1px solid var(--line);
    border-radius: 14px;
    padding: 20px;
    margin-top: 28px;
  }
  .card h2{
    font-family:'Bebas Neue',sans-serif;
    font-size: 22px;
    letter-spacing: 0.02em;
    color: var(--skin);
    margin-bottom: 4px;
  }
  .progress-row{
    display:flex; align-items:center; gap:10px;
    margin: 12px 0 16px;
  }
  .progress-track{
    flex:1; height: 6px; border-radius: 4px;
    background: var(--line); overflow:hidden;
  }
  .progress-fill{
    height:100%;
    background: linear-gradient(90deg, var(--skin-deep), var(--amber));
    width:0%;
    transition: width .3s ease;
  }
  .progress-label{ font-size: 12px; color: var(--text-dim); white-space:nowrap; font-variant-numeric: tabular-nums;}

  .check-item{
    display:flex; align-items:flex-start; gap:12px;
    padding: 10px 0;
    border-bottom: 1px solid var(--line);
    cursor:pointer;
  }
  .check-item:last-child{ border-bottom:none; }
  .box{
    flex-shrink:0;
    width: 20px; height:20px;
    border-radius: 5px;
    border: 2px solid var(--skin-deep);
    margin-top: 1px;
    display:flex; align-items:center; justify-content:center;
    transition: all .15s ease;
  }
  .check-item.checked .box{ background: var(--amber); border-color: var(--amber); }
  .box svg{ opacity:0; transform: scale(0.5); transition: all .15s ease; }
  .check-item.checked .box svg{ opacity:1; transform: scale(1); }
  .check-text{ font-size: 14px; line-height:1.4; }
  .check-item.checked .check-text{ color: var(--text-dim); text-decoration: line-through; text-decoration-color: var(--line); }

  footer{
    margin-top: 32px;
    text-align:center;
    font-size: 12px;
    color: var(--text-dim);
    letter-spacing: 0.04em;
  }
</style>
</head>
<body>
<div class="wrap">

  <header>
    <div class="eyebrow">Shoot Day Countdown</div>
    <h1>PREP<br>TIMELINE</h1>
    <p class="sub">Tap each stage to expand. Work backward from call time — skin and body respond to lead time, not last-minute effort.</p>
  </header>

  <div class="timeline" id="timeline"></div>

  <div class="card">
    <h2>Day-Of Kit Check</h2>
    <div class="progress-row">
      <div class="progress-track"><div class="progress-fill" id="progressFill"></div></div>
      <div class="progress-label" id="progressLabel">0 / 8</div>
    </div>
    <div id="checklist"></div>
  </div>

  <footer>tap · expand · check off · you got this</footer>
</div>

<script>
const stages = [
  {
    time: "T-48h",
    title: "Shave",
    body: `<ul>
      <li>Shave chest and legs 24–48h before, not same day</li>
      <li>Redness/razor burn needs this window to fully calm down</li>
      <li>Use a sharp fresh blade — dull blades cause more irritation, not less</li>
    </ul>`
  },
  {
    time: "T-24h",
    title: "Exfoliate + Moisturize",
    body: `<ul>
      <li>Light exfoliation the evening after shaving</li>
      <li>Unscented moisturizer, heavy layer — <span class="warn">avoid alcohol-based products</span>, they dry skin and flatten texture on camera</li>
      <li>No new skincare products this close to shoot — irritation risk</li>
    </ul>`
  },
  {
    time: "T-3h",
    title: "Water + Food",
    body: `<ul>
      <li>Stay hydrated up to this point, then taper slightly</li>
      <li>Slight water restriction reduces subcutaneous puffiness</li>
      <li class="warn">Don't overdo it — dehydration flattens muscle definition too, this is a light taper not a cut</li>
      <li>Light meal, nothing salty/bloating</li>
    </ul>`
  },
  {
    time: "T-45m",
    title: "Pump",
    body: `<ul>
      <li>Light pump work: pushups, band pulls, bodyweight squats</li>
      <li>Goal is fullness and vascularity, not fatigue — stop before you're tired</li>
      <li>2–3 short sets per muscle group max</li>
    </ul>`
  },
  {
    time: "T-10m",
    title: "Oil + Sheen",
    body: `<ul>
      <li>Thin, even layer of baby oil or muscle-sheen spray</li>
      <li>Applied right before camera, not earlier</li>
      <li class="warn">Too much oil reads as greasy under flash — less is more</li>
    </ul>`
  },
  {
    time: "T-0",
    title: "On Camera",
    body: `<ul>
      <li>Side or angled lighting creates shadow definition — flat front light kills it</li>
      <li>Slight waist twist, don't square fully to camera</li>
      <li>Flex and hold, keep moving between poses — best frames come from transitions</li>
    </ul>`
  }
];

const checklistItems = [
  "Fresh razor / trimmer",
  "Unscented moisturizer",
  "Baby oil or sheen spray",
  "Resistance band or light dumbbells",
  "Water bottle",
  "Outfit options laid out",
  "Phone charged / camera charged",
  "Snack that won't bloat"
];

const tl = document.getElementById('timeline');
stages.forEach((s, i) => {
  const el = document.createElement('div');
  el.className = 'stage';
  el.innerHTML = `
    <div class="stage-dot">${i+1}</div>
    <div class="stage-head">
      <span class="stage-time">${s.time}</span>
      <span class="stage-title">${s.title}</span>
      <span class="stage-arrow">▶</span>
    </div>
    <div class="stage-body"><div class="stage-content">${s.body}</div></div>
  `;
  el.querySelector('.stage-head').addEventListener('click', () => {
    const wasOpen = el.classList.contains('open');
    document.querySelectorAll('.stage').forEach(s => s.classList.remove('open'));
    if(!wasOpen) el.classList.add('open');
  });
  el.addEventListener('dblclick', () => el.classList.toggle('done'));
  tl.appendChild(el);
});

const checklistEl = document.getElementById('checklist');
const fill = document.getElementById('progressFill');
const label = document.getElementById('progressLabel');

function updateProgress(){
  const total = checklistItems.length;
  const checked = document.querySelectorAll('.check-item.checked').length;
  fill.style.width = (checked/total*100) + '%';
  label.textContent = `${checked} / ${total}`;
}

checklistItems.forEach(text => {
  const el = document.createElement('div');
  el.className = 'check-item';
  el.innerHTML = `
    <div class="box">
      <svg width="12" height="10" viewBox="0 0 12 10" fill="none">
        <path d="M1 5L4.5 8.5L11 1.5" stroke="#1e1815" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
      </svg>
    </div>
    <div class="check-text">${text}</div>
  `;
  el.addEventListener('click', () => {
    el.classList.toggle('checked');
    updateProgress();
  });
  checklistEl.appendChild(el);
});
updateProgress();
</script>
</body>
</html>
